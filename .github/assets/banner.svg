<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Hearing Compiler</title>
  <desc id="desc">A hearing's audio waveform flows into transcript lines and then into a reviewed note with one flagged item. Decorative project artwork.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050d18"/>
      <stop offset="0.52" stop-color="#0a1f2e"/>
      <stop offset="1" stop-color="#061720"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10283a"/>
      <stop offset="1" stop-color="#0a1b29"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5eead4" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#background)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="358" rx="27" fill="none" stroke="#5eead4" stroke-opacity="0.25" stroke-width="2"/>

  <ellipse cx="200" cy="180" rx="170" ry="130" fill="#2dd4bf" fill-opacity="0.10" filter="url(#softGlow)"/>
  <ellipse cx="1080" cy="180" rx="170" ry="130" fill="#38bdf8" fill-opacity="0.10" filter="url(#softGlow)"/>

  <!-- 1. The hearing's audio -->
  <g transform="translate(72 180)" filter="url(#glow)" fill="url(#spectrum)">
    <rect x="0" y="-18" width="10" height="36" rx="5"/>
    <rect x="20" y="-46" width="10" height="92" rx="5"/>
    <rect x="40" y="-28" width="10" height="56" rx="5"/>
    <rect x="60" y="-70" width="10" height="140" rx="5"/>
    <rect x="80" y="-38" width="10" height="76" rx="5"/>
    <rect x="100" y="-58" width="10" height="116" rx="5"/>
    <rect x="120" y="-24" width="10" height="48" rx="5"/>
    <rect x="140" y="-50" width="10" height="100" rx="5"/>
    <rect x="160" y="-32" width="10" height="64" rx="5"/>
    <rect x="180" y="-62" width="10" height="124" rx="5"/>
    <rect x="200" y="-20" width="10" height="40" rx="5"/>
    <rect x="220" y="-40" width="10" height="80" rx="5"/>
    <rect x="240" y="-14" width="10" height="28" rx="5"/>
  </g>

  <path d="M346 180 H404" stroke="#5eead4" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="6 8"/>
  <path d="M398 172 L410 180 L398 188" fill="none" stroke="#5eead4" stroke-opacity="0.7" stroke-width="3"/>

  <!-- 2. The transcript, with timestamps -->
  <g transform="translate(430 86)">
    <rect width="300" height="188" rx="18" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="2"/>
    <g font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#22d3ee">
      <text x="22" y="40">0:12</text><text x="22" y="76">0:20</text><text x="22" y="112">0:28</text><text x="22" y="148">0:36</text>
    </g>
    <g fill="#e2f3f5" fill-opacity="0.75">
      <rect x="70" y="30" width="196" height="10" rx="5"/>
      <rect x="70" y="66" width="168" height="10" rx="5"/>
      <rect x="70" y="102" width="206" height="10" rx="5"/>
      <rect x="70" y="138" width="140" height="10" rx="5"/>
    </g>
  </g>

  <path d="M752 180 H810" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="6 8"/>
  <path d="M804 172 L816 180 L804 188" fill="none" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="3"/>

  <!-- 3. The note, with one item still to check -->
  <g transform="translate(836 70)">
    <rect width="372" height="220" rx="18" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="22" y="24" width="132" height="12" rx="6" fill="#5eead4" fill-opacity="0.9"/>
    <g fill="#e2f3f5" fill-opacity="0.72">
      <rect x="22" y="58" width="300" height="9" rx="4.5"/>
      <rect x="22" y="82" width="250" height="9" rx="4.5"/>
      <rect x="22" y="148" width="280" height="9" rx="4.5"/>
      <rect x="22" y="172" width="210" height="9" rx="4.5"/>
    </g>
    <rect x="16" y="102" width="340" height="32" rx="10" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.65"/>
    <path d="M36 126 L46 108 L56 126 Z" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="45" y="113" width="2" height="6" fill="#fbbf24"/><rect x="45" y="121" width="2" height="2" fill="#fbbf24"/>
    <rect x="70" y="113" width="220" height="9" rx="4.5" fill="#fde68a" fill-opacity="0.8"/>
  </g>
</svg>
